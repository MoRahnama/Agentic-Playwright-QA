<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small task board for practicing browser testing.">
    <title>Task Board | Agentic Playwright QA</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #152238;
        background: #f3f6fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 3rem 1.25rem; }
      main { max-width: 720px; margin: 0 auto; }
      .eyebrow { color: #4263a5; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: .4rem 0; font-size: clamp(2rem, 6vw, 3rem); }
      .intro { color: #52627a; line-height: 1.6; }
      .panel { margin-top: 1.5rem; padding: 1.5rem; border: 1px solid #dbe3ef; border-radius: 16px; background: #fff; box-shadow: 0 12px 32px #2439580d; }
      form { display: flex; gap: .75rem; margin-top: .75rem; }
      label { display: block; font-weight: 650; }
      input { width: 100%; min-width: 0; padding: .8rem .9rem; border: 1px solid #bdc9da; border-radius: 9px; font: inherit; }
      input:focus-visible, button:focus-visible { outline: 3px solid #94b8ff; outline-offset: 2px; }
      button { padding: .7rem 1rem; border: 1px solid #c8d3e2; border-radius: 9px; background: #fff; color: #152238; font: inherit; font-weight: 650; cursor: pointer; }
      button:hover { background: #f2f6fc; }
      button.primary { flex: 0 0 auto; border-color: #2859ad; background: #2859ad; color: #fff; }
      button.primary:hover { background: #1d478f; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; }
      .filters { display: flex; gap: .4rem; }
      .filters button[aria-pressed="true"] { border-color: #2859ad; color: #214d99; background: #edf3ff; }
      #task-list { display: grid; gap: .75rem; margin: 1rem 0 0; padding: 0; list-style: none; }
      .task { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1rem; border: 1px solid #e0e6ef; border-radius: 10px; }
      .task-title { overflow-wrap: anywhere; }
      .task.completed .task-title { color: #63718a; text-decoration: line-through; }
      .empty { padding: 1.5rem 0; color: #63718a; text-align: center; }
      .status { min-height: 1.5rem; margin-top: .75rem; color: #9d2d2d; }
      @media (max-width: 520px) {
        body { padding: 2rem 1rem; }
        form, .toolbar { align-items: stretch; flex-direction: column; }
        .filters { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Playwright agent practice app</p>
      <h1>Task Board</h1>
      <p class="intro">Create tasks, mark work complete, and filter the list. Use this local app to practice observable, user-facing browser tests.</p>

      <section class="panel" aria-labelledby="create-heading">
        <h2 id="create-heading">Add a task</h2>
        <form id="task-form">
          <div style="flex: 1">
            <label for="task-title">Task name</label>
            <input id="task-title" name="title" autocomplete="off" maxlength="120" required>
          </div>
          <button class="primary" type="submit">Add task</button>
        </form>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Your tasks</h2>
        <div class="toolbar">
          <span id="task-count" aria-live="polite">0 tasks</span>
          <nav class="filters" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </nav>
        </div>
        <ul id="task-list" aria-label="Tasks"></ul>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
